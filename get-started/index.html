<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      PUBLIC, unlike the client forms under /testimonial/. This one is meant
      to be found: it carries no noindex, it is not disallowed in
      robots.txt, and it has a canonical. Do not copy the noindex block from
      testimonial/index.html into this file.
    -->
    <title>Get a free website audit | GrowClientsAI</title>
    <meta
      name="description"
      content="Free website audit or consultation for local service businesses. Tell me where you are starting from and I will come back with something specific."
    />
    <link rel="canonical" href="https://growclientsai.com/get-started/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://growclientsai.com/get-started/" />
    <meta property="og:title" content="Get a free website audit | GrowClientsAI" />
    <meta
      property="og:description"
      content="Free, and no pitch at the end of it. Tell me where you are starting from."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F3EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131C2B" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Key must match THEME_KEY in src/lib/theme.ts. See index.html. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gcai-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/forms/entry-get-started.tsx"></script>
  </body>
</html>
