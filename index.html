<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GrowClientsAI | Websites That Win Local Clients</title>
    <meta
      name="description"
      content="I build and rebuild websites for local service businesses: the kind that make it easier for someone to call, book, or buy, not just look nice."
    />
    <link rel="canonical" href="https://growclientsai.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://growclientsai.com/" />
    <meta property="og:title" content="GrowClientsAI | Websites That Win Local Clients" />
    <meta
      property="og:description"
      content="Websites for local service businesses that make it easier for someone to call, book, or buy."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1320" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Applies the stored theme before first paint. Must stay blocking and
      inline: deferring it means the page paints light, then snaps to dark.
      Key must match THEME_KEY in src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gcai-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      No-JS fallback only. React replaces nothing here: #root is empty and
      this sits outside it, so it renders only when scripting is off. It
      exists because the markup this replaced was doing that job, badly, as
      a stale holding page. Keep it short and keep it true to
      src/data/content.ts; it is not a second copy of the site.
    -->
    <noscript>
      <div class="mx-auto max-w-2xl px-5 py-16">
        <h1 class="font-display text-3xl uppercase leading-[1.1] text-content">
          Websites that win local clients
        </h1>
        <p class="mt-5 text-[1.0625rem] leading-relaxed text-muted">
          I build and rebuild websites for local service businesses: the kind that make it
          easier for someone to call, book, or buy, not just look nice.
        </p>
        <p class="mt-6 text-[1.0625rem] leading-relaxed text-content">
          Darrin Duncan, GrowClientsAI.
          <a href="mailto:darrin@darrinduncan.com" class="underline underline-offset-2"
            >darrin@darrinduncan.com</a
          >
          or <a href="tel:+15702005552" class="underline underline-offset-2">570-200-5552</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
